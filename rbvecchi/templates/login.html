<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-180.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <title>Accesso · {{ app_name }}</title>
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card">
      <div class="login-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3V10.5zm2 1V19h2v-6h10v6h2v-7.5L12 5.7 5 11.5z"/></svg>
      </div>
      <p class="eyebrow">Casa</p>
      <h1>{{ app_name }}</h1>
      <p class="login-intro">Accedi per visualizzare lo stato e comandare il basculante.</p>
      {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
      <form method="post" action="/login" class="login-form">
        <label>
          <span>Utente</span>
          <input name="username" type="text" autocomplete="username" required autofocus>
        </label>
        <label>
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary-button" type="submit">Accedi</button>
      </form>
    </section>
  </main>
</body>
</html>
