{% extends "base.html" %}
{% block title %}Accesso · {{ app_name }}{% endblock %}
{% block body %}
<main class="login">
  <section class="card login-card">
    <span class="logo"><svg class="icon"><use href="#i-garage"/></svg></span>
    <h1>{{ app_name }}</h1>
    <p class="note">Accedi per vedere lo stato di casa e comandare il basculante.</p>
    {% if error %}<p class="notice err" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="login-form">
      <label class="field">
        <span>Utente</span>
        <input name="username" type="text" autocomplete="username" autocapitalize="none" required autofocus>
      </label>
      <label class="field">
        <span>Password</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn-primary btn-block" type="submit">Accedi</button>
    </form>
  </section>
</main>
{% endblock %}
